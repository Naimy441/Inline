name: Desktop

# Builds the desktop app (desktop/) for Windows and Linux. The macOS app is
# built, signed and notarized on a Mac and uploaded to the same release with
# `npm run dist -- --publish` (see desktop/README.md), so no Apple
# credentials live on GitHub.
#
# - Pushing a tag like v0.2.0 builds both platforms and uploads the installers
#   to a draft GitHub release for that tag. Publish the draft to make it the
#   download (and the update) everyone gets.
# - Running the workflow by hand builds the installers as workflow artifacts
#   only, for trying them out.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: desktop

      # The Mac build made locally uses desktop/package.json's version, so the
      # tag has to match it for both to land in the same release.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match desktop/package.json version $version"
            exit 1
          fi

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=--publish; fi
          node scripts/dist.mjs ${{ matrix.platform }} $publish

      - uses: actions/upload-artifact@v4
        with:
          name: inline-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.yml
