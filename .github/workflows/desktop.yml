name: Desktop

# Builds the desktop app (desktop/) for macOS, Windows and Linux.
#
# - Pushing a tag like v0.2.0 builds every platform and uploads the installers
#   to a draft GitHub release for that tag. Publish the draft to make it the
#   download (and the update) everyone gets.
# - Running the workflow by hand builds the installers as workflow artifacts
#   only, for trying them out.
#
# macOS builds are signed and notarized when these repository secrets are set
# (see desktop/README.md), and unsigned otherwise:
#   MAC_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   MAC_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: desktop

      - name: Match the app version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=--publish; fi
          node scripts/dist.mjs ${{ matrix.platform }} $publish

      - uses: actions/upload-artifact@v4
        with:
          name: inline-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.yml
